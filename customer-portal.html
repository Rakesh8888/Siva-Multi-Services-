<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10251d"><title>Siva Multi Services | Customer Portal</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f6f3;color:#17251e;font-family:system-ui,Arial}.head{background:#10251d;color:#fff;padding:22px 16px}.head h1{margin:0;font-size:22px}.head p{margin:5px 0;color:#c8d8ce;font-size:13px}.wrap{max-width:760px;margin:20px auto;padding:0 14px}.card{background:white;border:1px solid #e0e9e2;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 3px 14px #10251d0a}h2{font-size:18px;margin:0 0 12px}label{display:block;font-size:13px;margin:12px 0 5px;color:#526258}input{width:100%;padding:13px;border:1px solid #cbd8cf;border-radius:9px;font:inherit}button{padding:12px 16px;border:0;border-radius:9px;background:#176b45;color:white;font-weight:700;margin-top:12px}button.alt{background:#e8f1eb;color:#175437}.muted{color:#68766e;font-size:13px}.msg{padding:10px;background:#edf5ef;border-radius:9px;margin-top:10px;font-size:13px}.error{background:#fff0ee;color:#a52b20}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#f1f7f3;padding:12px;border-radius:10px}.stat small{display:block;color:#617066}.stat b{font-size:18px}.item{padding:11px 0;border-bottom:1px solid #edf1ee}.item:last-child{border:0}.portal-link{display:inline-block;padding:10px 13px;background:#e8f1eb;color:#175437;border-radius:9px;text-decoration:none;font-weight:700;font-size:13px}@media(max-width:480px){.stats{grid-template-columns:1fr}.stat b{font-size:16px}}</style></head><body><header class="head"><h1>Siva Multi Services</h1><p>Customer Portal · Services · Payments · Balance</p></header><main class="wrap">
<section class="card"><a class="portal-link" href="customer-tracking.html">Visa & Cruise Application Status →</a></section>
<section class="card" id="login"><h2>Customer Login</h2><p class="muted">Use the Customer ID and 4-digit PIN provided by Siva Multi Services.</p><label>Customer ID</label><input id="cid" autocomplete="username" placeholder="SIVA-XXXXXXXX"><label>4-digit PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" placeholder="••••••"><button id="sign">Login</button><div id="loginMsg" class="msg hidden"></div></section>
<section id="dash" class="hidden"><div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h2 id="name"></h2><div class="muted" id="code"></div></div><button class="alt" id="logout">Logout</button></div></div><div class="card"><h2>Account Summary</h2><div class="stats"><div class="stat"><small>Total Service Fee</small><b id="fee"></b></div><div class="stat"><small>Total Paid</small><b id="paid"></b></div><div class="stat"><small>Balance Due</small><b id="bal"></b></div></div></div><div class="card"><h2>My Services</h2><div id="services" class="muted"></div></div><div class="card"><h2>Payment History</h2><div id="payments" class="muted"></div></div></section>
</main><script>(()=>{let token="";const $=id=>document.getElementById(id),money=p=>(Number(p||0)/100).toLocaleString("en-IN",{style:"currency",currency:"INR"});function message(id,t,err=false){const e=$(id);e.textContent=t;e.classList.remove("hidden","error");if(err)e.classList.add("error")}async function api(path,method="GET"){const r=await fetch(path,{method,headers:token?{Authorization:"Bearer "+token}:{}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d}async function load(){const d=await api("/api/customer/ledger");$("name").textContent=d.customer.fullName;$("code").textContent=d.customer.customerCode;$("fee").textContent=money(d.summary.totalFeePaise);$("paid").textContent=money(d.summary.totalPaidPaise);$("bal").textContent=money(d.summary.balancePaise);$("services").innerHTML=d.services.length?d.services.map(x=>"<div class=item><b>"+esc(x.service_name)+"</b><div class=muted>"+money(x.fee_paise)+" · "+esc(x.status)+" · "+esc(x.created_at)+"</div></div>").join(""):"No services recorded."; $("payments").innerHTML=d.payments.length?d.payments.map(x=>"<div class=item><b>"+money(x.amount_paise)+"</b><div class=muted>"+esc(x.service_name||"Unallocated legacy payment")+" · "+esc(x.method)+" · "+esc(x.created_at)+"</div></div>").join(""):"No payments recorded."}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}$("sign").onclick=async()=>{try{const r=await fetch("/api/customer/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({customerId:$("cid").value,pin:$("pin").value})});const d=await r.json();if(!r.ok)throw Error(d.error||"Login failed");token=d.token;$("login").classList.add("hidden");$("dash").classList.remove("hidden");await load()}catch(e){message("loginMsg",e.message,true)}};$("logout").onclick=async()=>{try{await api("/api/customer/logout","POST")}catch{}token="";$("dash").classList.add("hidden");$("login").classList.remove("hidden");$("pin").value=""}})();</script></body></html>
