name: Deploy Siva Multi Services to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - "worker.js"
      - "**/*.html"
      - "**/*.js"
      - "**/*.css"
      - "**/*.svg"
      - "assets/**"
      - "toolkit/**"
      - "package.json"
      - "wrangler.jsonc"
      - ".assetsignore"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Verify BGE-M3 dimensions and ensure Vectorize index
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const token = (process.env.CLOUDFLARE_API_TOKEN || "").replace(/\s+/g, "");
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !account) throw new Error("Cloudflare GitHub Actions secrets are missing.");
          const base = `https://api.cloudflare.com/client/v4/accounts/${account}`;
          const headers = { Authorization: `Bearer ${token}`, "Content-Type": "application/json" };
          async function api(path, options = {}) {
            const response = await fetch(base + path, { ...options, headers: { ...headers, ...(options.headers || {}) } });
            const data = await response.json();
            if (!response.ok || data.success === false) {
              const detail = (data.errors || []).map(e => e.message || e.code).join("; ") || response.statusText;
              throw new Error(`Cloudflare API ${response.status}: ${detail}`);
            }
            return data.result;
          }
          const embedding = await api("/ai/run/@cf/baai/bge-m3", {
            method: "POST",
            body: JSON.stringify({ text: ["SIVA MULTI SERVICES multilingual knowledge index dimension check"] })
          });
          const vectors = embedding?.data || embedding?.result?.data;
          if (!Array.isArray(vectors) || !Array.isArray(vectors[0]) || !vectors[0].length) {
            throw new Error("BGE-M3 returned an unexpected embedding response; refusing to guess index dimensions.");
          }
          const dimensions = vectors[0].length;
          console.log(`Verified BGE-M3 output dimension: ${dimensions}`);
          const indexes = await api("/vectorize/v2/indexes");
          const existing = (indexes?.indexes || indexes || []).find(index => index.name === "siva-ai-knowledge");
          if (existing) {
            const currentDimensions = existing.config?.dimensions;
            if (currentDimensions !== dimensions) {
              throw new Error(`Existing siva-ai-knowledge index has ${currentDimensions} dimensions; BGE-M3 requires ${dimensions}. No destructive change was made.`);
            }
            console.log("Vectorize index already exists with matching dimensions.");
          } else {
            await api("/vectorize/v2/indexes", {
              method: "POST",
              body: JSON.stringify({
                name: "siva-ai-knowledge",
                description: "Multilingual knowledge base for SIVA MULTI SERVICES AI assistant",
                config: { dimensions, metric: "cosine" }
              })
            });
            console.log("Created siva-ai-knowledge Vectorize index.");
          }
          NODE

      - name: Deploy Worker and static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
